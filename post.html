<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Read the latest article on Inkora.">
    <title>Article | Inkora</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">

    <script src="./js/posts.js" defer></script>
    <script src="./js/main.js" defer></script>
    <script src="./js/search.js" defer></script>
    <script src="./js/post.js" defer></script>
</head>

<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                Inkora
            </a>

            <nav class="navbar" id="navbar" aria-label="Main navigation">
                <a href="index.html" class="navbar-link">Home</a>
                <a href="index.html#featured" class="navbar-link">Featured</a>
                <a href="index.html#latest" class="navbar-link">Latest</a>
                <a href="index.html#categories" class="navbar-link">Categories</a>
                <a href="index.html#about" class="navbar-link">About</a>
            </nav>

            <div class="header-actions">
                <button class="icon-btn" id="searchBtn" type="button" aria-label="Open search">
                    🔍
                </button>

                <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle dark mode">
                    🌙
                </button>

                <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation menu" aria-expanded="false">
                    ☰
                </button>
            </div>
        </div>
    </header>

    <div class="search-overlay" id="searchOverlay">
        <div class="search-container">
            <button class="close-search" id="closeSearch" type="button" aria-label="Close search">
                ✕
            </button>
            <h2>Search Inkora</h2>
            <form class="search-form" id="searchForm">
                <input type="search" id="searchInput" placeholder="Search articles..." autocomplete="off">
                <button type="submit" class="btn">Search</button>
            </form>
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <main>

        <article class="article">
            <div class="container">
                <div id="articleContent">
                </div>
            </div>
        </article>

        <section class="related-section" id="relatedSection">
            <div class="container">
                <h2 class="section-title">
                    Related Articles
                </h2>

                <div class="post-grid" id="relatedPosts">
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 Inkora. All rights reserved.</p>
                <p>Made by Arth</p>
            </div>
        </div>
    </footer>

</body>

</html>
